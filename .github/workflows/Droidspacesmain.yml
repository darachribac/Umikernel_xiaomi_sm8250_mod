name: Build droidspaces Kernel

on:
  push:
    branches: [ android15-lineage22-mod ]
  pull_request:
    branches: [ android15-lineage22-mod ]
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Code (设备代号)'
        required: true
        default: 'umi'
        type: choice
        options:
          - umi
          # You can keep other devices if needed, but umi is now default
      ksu:
        description: 'Enable KernelSU with SUSFS (ReSukiSU)'
        required: true
        type: boolean
        default: true

jobs:
  build-kernel:
    name: Build ${{ github.event.inputs.device || 'umi' }} | ${{ github.event_name == 'push' && 'KSU' || (github.event.inputs.ksu == 'true' && 'KSU' || 'NoKSU') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
            git gnupg gperf libncurses-dev \
            lib32readline-dev lib32z1-dev liblz4-tool \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 \
            clang lld gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache_mikernel
          key: ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device || 'umi' }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device || 'umi' }}-
            ${{ runner.os }}-kernel-ccache-

      - name: Setup proton-clang Toolchain
        run: |
          TC="$HOME/proton-clang/proton-clang-20210522/bin"
          mkdir -p "$TC"
          cd "$TC"
          ln -sf "$(command -v clang)" clang
          ln -sf "$(command -v ld.lld)" ld.lld
          for p in aarch64-linux-gnu arm-linux-gnueabi; do
            for t in ld as ar nm objcopy objdump strip readelf gcc g++ cpp; do
              if command -v $p-$t >/dev/null; then
                ln -sf "$(command -v $p-$t)" "$p-$t"
              fi
            done
          done
          # Enable ccache for clang via PATH symlink
          sudo ln -sf "$(command -v ccache)" /usr/lib/ccache/clang

      # ------------------------------------------------------------------
      # NEW STEP: Integrate Droidspaces kernel configuration
      # ------------------------------------------------------------------
      - name: Apply Droidspaces kernel configuration
        run: |
          # Clone Droidspaces-OSS for reference (optional, but keeps the source of truth)
          git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git /tmp/Droidspaces-OSS

          # Create the mandatory config fragment for non-GKI kernels (4.19)
          cat > /tmp/droidspaces.config << 'EOF'
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_MEMCG=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_DEVTMPFS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_FW_LOADER_COMPRESS=y
          CONFIG_NET_NS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          EOF

          # Locate the umi defconfig (try vendor path first, fall back to any umi defconfig)
          DEFCONFIG=$(find arch/arm64/configs -name '*umi*defconfig' | head -n 1)
          if [ -z "$DEFCONFIG" ]; then
            echo "ERROR: umi defconfig not found. Aborting."
            exit 1
          fi
          echo "Found defconfig: $DEFCONFIG"

          # Append the fragment. Later entries in a defconfig override earlier ones,
          # so this ensures all required options are enabled.
          cat /tmp/droidspaces.config >> "$DEFCONFIG"
          echo "Droidspaces configuration appended to $DEFCONFIG"

          # Quick sanity check (only prints the lines; does not fail the build)
          grep -E 'CONFIG_(SYSVIPC|NAMESPACES|CGROUPS|SECCOMP)=' "$DEFCONFIG" | tail -n 5

      # ------------------------------------------------------------------
      # Build step (unchanged, but now uses the updated defconfig)
      # ------------------------------------------------------------------
      - name: Run Build Script
        run: |
          chmod +x build.sh

          DEVICE="${{ github.event.inputs.device || 'umi' }}"
          ARGS="$DEVICE"

          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            ARGS="$ARGS ksu"
          elif [ "${{ github.event.inputs.ksu }}" = "true" ]; then
            ARGS="$ARGS ksu"
          fi

          echo "Executing command: ./build.sh $ARGS"
          ./build.sh $ARGS

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ github.event.inputs.device || 'umi' }}-${{ github.event_name == 'push' && 'KSU' || (github.event.inputs.ksu == 'true' && 'KSU' || 'NoKSU') }}-${{ github.run_id }}
          path: "*.zip"
          compression-level: 0
          if-no-files-found: ignore
